version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/React-tsx"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    ignore:
      # typescript-eslint@8.x peer-depends on typescript <6.1.0; unblock
      # once typescript-eslint adds TS7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
