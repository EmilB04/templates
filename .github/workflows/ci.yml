name: CI

on:
  push:
    branches: [main]
    paths:
      - "React-tsx/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "React-tsx/**"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: React-tsx

jobs:
  audit:
    name: Lint, build & audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: React-tsx/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
